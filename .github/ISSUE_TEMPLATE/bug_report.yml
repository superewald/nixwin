name: Bug report
description: Something behaves differently from what is documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more precisely the
        behaviour is pinned down, the faster it can be reproduced and fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: |
        `nixwin install 17` fails with "..." after the SDK is downloaded.
        Expected it to link the sysroot and exit 0.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps or commands that shows the problem.
      render: shell
      placeholder: |
        1. nixwin setup
        2. nixwin install 17 --default
        3. source $NIXWIN_SYSROOT/llvm.env
        4. clang-cl $NIXWIN_LLVM_FLAGS main.cpp -o app.exe
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: nixwin version
      description: Output of `nixwin --version`, or the install method if built from source.
      placeholder: "nixwin 0.1.0"
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host
      description: Operating system, CPU architecture, and the toolchain involved (clang/CMake/cargo version).
      placeholder: "ubuntu 24.04, x86_64, clang 18.1.3"
    validations:
      required: true

  - type: textarea
    id: sysroot-config
    attributes:
      label: Sysroot configuration
      description: |
        The resolved configuration of the sysroot involved. `nixwin inspect <TAG>`
        prints the installed versions; a project `.nixwin.json` shows the
        requested ones.
      render: shell
      placeholder: |
        $ nixwin inspect 17
        $ cat .nixwin.json
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Full output
      description: The complete terminal output, including the error, with secrets removed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for this.
          required: true
        - label: I read the docs linked from the README for the area involved.
          required: false
