[package]
name = "nixwin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
handlebars = "6"
indicatif = "0.18.6"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xwin = { version = "0.10.0", path = "../xwin" }

[dev-dependencies]
tempfile = "3"
